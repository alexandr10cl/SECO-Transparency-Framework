[pytest]
testpaths = tests
markers =
    integration: depende de rede e/ou de servicos externos (Playwright, API do Gemini).
        Desligado por padrao (ver addopts) - rode com `pytest -m integration`.
        Alguns desses testes tambem exigem GEMINI_API_KEY configurada; sem ela,
        pulam sozinhos em vez de falhar.
addopts = -m "not integration"
